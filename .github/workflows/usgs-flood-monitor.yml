name: usgs-flood-monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: usgs-flood-monitor-publish
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime directory
        run: mkdir -p "$GITHUB_WORKSPACE/runtime"

      - name: Monitor Mojave River gages
        env:
          SBCO_BASE_DIR: ${{ github.workspace }}/runtime
          USGS_NTFY_TOPIC: ${{ secrets.USGS_NTFY_TOPIC }}
          USGS_SMTP_HOST: ${{ secrets.USGS_SMTP_HOST }}
          USGS_SMTP_PORT: ${{ secrets.USGS_SMTP_PORT }}
          USGS_SMTP_FROM: ${{ secrets.USGS_SMTP_FROM }}
          USGS_SMTP_TO: ${{ secrets.USGS_SMTP_TO }}
          USGS_SMTP_USER: ${{ secrets.USGS_SMTP_USER }}
          USGS_SMTP_PASS: ${{ secrets.USGS_SMTP_PASS }}
          USGS_SMTP_STARTTLS: ${{ secrets.USGS_SMTP_STARTTLS }}
        run: python usgs_flood_monitor.py

      - name: Deploy flood data files
        if: always()
        env:
          SBCO_FTP_HOST: ${{ secrets.SERV00_FTP_HOST }}
          SBCO_FTP_USER: ${{ secrets.SERV00_FTP_USER }}
          SBCO_FTP_PASS: ${{ secrets.SERV00_FTP_PASS }}
          SBCO_FTP_REMOTE_DIR: /domains/upnexx.xyz/public_html/osint
        run: |
          python deploy_ftp_file.py runtime/mojave_river.json mojave_river.json
          python deploy_ftp_file.py runtime/mojave_flood_status.json mojave_flood_status.json

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-flood-runtime-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/runtime/*.json
