name: lightning-outages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: lightning-outages-publish
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime directory
        run: mkdir -p "$GITHUB_WORKSPACE/runtime"

      - name: Scrape lightning strikes
        env:
          SBCO_BASE_DIR: ${{ github.workspace }}/runtime
          SBCO_RUNNER_ID: lightning-${{ github.run_id }}-${{ github.run_attempt }}
        run: python lightning_scraper.py

      - name: Scrape SCE outages
        env:
          SBCO_BASE_DIR: ${{ github.workspace }}/runtime
          SBCO_RUNNER_ID: outages-${{ github.run_id }}-${{ github.run_attempt }}
        run: python sce_outage_scraper.py

      - name: Deploy data files
        if: always()
        env:
          SBCO_FTP_HOST: ${{ secrets.SERV00_FTP_HOST }}
          SBCO_FTP_USER: ${{ secrets.SERV00_FTP_USER }}
          SBCO_FTP_PASS: ${{ secrets.SERV00_FTP_PASS }}
          SBCO_FTP_REMOTE_DIR: /domains/upnexx.xyz/public_html/osint
        run: |
          python deploy_ftp_file.py runtime/lightning_strikes.json lightning_strikes.json
          python deploy_ftp_file.py runtime/lightning_status.json lightning_status.json
          python deploy_ftp_file.py runtime/sce_outages.json sce_outages.json
          python deploy_ftp_file.py runtime/sce_outage_status.json sce_outage_status.json

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-outages-runtime-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/runtime/*.json
